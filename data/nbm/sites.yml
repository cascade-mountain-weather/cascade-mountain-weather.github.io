# Forecast points for scripts/nbm_snapshot.py. One entry per area in the weekend forecast post.
# Names match the posts and data/forecasts/eval_forecast_*.json so snapshots line up with them.
#
# lat/lon are APPROXIMATE (placed near the base area or pass, from memory, not surveyed).
# The NBM grid is 2.5 km, so a few hundred meters does not change the nearest point, but a
# mountain site can sit on a very different cell from the road or base. Check and adjust:
# the snapshot records km_to_grid_point for each site. Stevens Pass was verified against the
# viewer CSV (data/forecasts/Stevens Pass.csv) in docs/nbm_fields.md.
#
# Elevations are computed from a DEM by scripts/site_elevations.py (rerun it after editing this
# file) and used by scripts/nbm_snapshot.py to correct 2 m temperature to the forecast elevation.

# Forecast elevation: a site below this is forecast at this elevation instead of its own, so
# every area is comparable at ski-terrain height. A site already above it keeps its own elevation.
# An `elevation_ft` on a site (optional) replaces its DEM elevation BEFORE the floor is applied.
forecast_floor_ft: 5000

# obs: SNOTEL stations used to score the forecast (scripts/snotel_obs.py), averaged when there are
# two. These are the stations the old evaluation used (scripts/build_fx_evaluation.py). Their
# elevations differ from the 5000 ft forecast elevation, and the scoring output records both:
#   Wells Creek 4040 ft, Easy Pass 5280, Harts Pass 6490, Waterhole 5010, Stevens Pass 3940,
#   Blewett Pass 4240, Olallie Meadows 4010, Corral Pass 5810, Paradise 5150, Pigtail Peak 5800.
# Change a station here and the scores follow; old scores are not recomputed.

sites:
  - {name: Mt. Baker,        lat: 48.857, lon: -121.667, obs: ["909:WA:SNTL", "998:WA:SNTL"]}   # Heather Meadows; Wells Creek + Easy Pass
  - {name: Washington Pass,  lat: 48.524, lon: -120.646, obs: ["515:WA:SNTL"]}                  # Harts Pass
  - {name: Stevens Pass,     lat: 47.745, lon: -121.089, obs: ["791:WA:SNTL"]}
  - {name: Hurricane Ridge,  lat: 47.970, lon: -123.498, obs: ["974:WA:SNTL"]}                  # Waterhole
  - {name: Blewett Pass,     lat: 47.350, lon: -120.580, obs: ["352:WA:SNTL"]}
  - {name: Snoqualmie Pass,  lat: 47.428, lon: -121.416, obs: ["672:WA:SNTL"]}                  # Olallie Meadows
  - {name: Crystal,          lat: 46.935, lon: -121.475, obs: ["418:WA:SNTL"]}                  # Corral Pass
  - {name: Paradise,         lat: 46.786, lon: -121.736, obs: ["679:WA:SNTL"]}
  - {name: White Pass,       lat: 46.638, lon: -121.391, obs: ["692:WA:SNTL"]}                  # Pigtail Peak

# Verification points: radiosonde launch sites. The snapshot also saves NBM snow level at these points so
# scripts/score_forecast.py can compare it with the snow level computed from the actual sounding at the
# same place and time (apples to apples; a sounding says nothing about a ski area 100 km away).
# Quillayute is the upstream Pacific station, Salem the south. Spokane (OTX) was dropped: its soundings are
# missing from IEM's feed. Coordinates are approximate (the NBM grid is 2.5 km).
verification_points:
  - {name: Quillayute, station: UIL, lat: 47.934, lon: -124.555}
  - {name: Salem,      station: SLE, lat: 44.920, lon: -123.020}

# Points the NBM plume page (scripts/nbm_plume.py) draws but the weekend forecast and its scoring do not use.
# Winthrop: coordinates from CW3E's West-WRF station list (station S52). It is a valley town, so the NBM point
# is valley level, not ski terrain.
plume_only_sites:
  - {name: Winthrop, lat: 48.4249, lon: -120.1459}
