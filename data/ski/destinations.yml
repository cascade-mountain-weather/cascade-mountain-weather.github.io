# Ski tool destinations (Phase 1 skeleton; see PLAN.md "Ski-area recommendation tool: design").
#
# A zone is what the tool recommends; its access points are where you park. Forecast, avalanche region and road
# dependencies attach to the zone. EVERYTHING HERE IS A FIRST DRAFT: coordinates are approximate (placed from memory,
# not surveyed), `top_ft`/`vert` are rough guesses until scripts/ski_dem.py fills measured values, and WSDOT pass ids
# are left empty until Phase 0 of the WSDOT work prints the real list. Check each entry before it is published.
#
# Fields
#   id, name          short id used in the data files, and the display name
#   modes             resort | backcountry | nordic: which modes can recommend this zone
#   nwac_zone         NWAC forecast zone (backcountry gating); null for non-US or outside NWAC
#   forecast_point    where the NBM is sampled (lat, lon); usually near the winter access point, raised to ski-terrain height
#   winter_access     the plowed terminus: drive time is measured to it
#   top_ft            high point of the terrain people ski (rough); vert = top_ft minus the lowest access elevation
#   road_dependencies WSDOT pass ids that must be open to reach the zone (filled in from real data later)
#   pass              what it costs to park/enter: sno_park | trail_pass | resort_ticket | none (typed, not boolean)
#   snotel            nearby SNOTEL station triplets for "what actually fell" (primary one first)
#   url               a page to check conditions
#   grooming_url      nordic only, link-only in the beta
#   drive_hours       approximate free-flow hours from the major origins (hand estimates, replaced by a routing script)
#   verify            things Danny should confirm
origins:
  seattle:   {name: Seattle,   lat: 47.606, lon: -122.332}
  tacoma:    {name: Tacoma,    lat: 47.253, lon: -122.444}
  bellingham: {name: Bellingham, lat: 48.752, lon: -122.479}
  olympia:   {name: Olympia,   lat: 47.038, lon: -122.900}
  portland:  {name: Portland,  lat: 45.515, lon: -122.679}

