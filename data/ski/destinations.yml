    road_dependencies: [snoqualmie]
    pass: {type: sno_park}
    snotel: ["672:WA:SNTL", "788:WA:SNTL"]
    url: https://summitatsnoqualmie.com
    grooming_url: https://parks.wa.gov/find-sno-parks/hyak-sno-park
    drive_hours: {seattle: 0.9, tacoma: 1.2, bellingham: 2.6, olympia: 1.9, portland: 4.3}
