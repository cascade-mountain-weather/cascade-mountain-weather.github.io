<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Cascade Mountain Weather",
  "url": "{{ site.url }}",
  "logo": "{{ '/assets/images/favicon.svg' | absolute_url }}",
  "description": "{{ site.description }}",
  "sameAs": [],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "Customer Service",
    "areaServed": "US-WA"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Cascade Mountain Weather",
  "url": "{{ site.url }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ '/posts/archive.html' | absolute_url }}?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<style>
    header {
        position: relative;
    }
</style>
</head>

<body>
{% include header.html %}
{% include nav.html %}

<main>
{{ content }}
</main>

{% include footer.html %}
{% include pwa-scripts.html %}
{% include lightbox.html %}
{% include mailchimp.html %}
</body>
</html>
