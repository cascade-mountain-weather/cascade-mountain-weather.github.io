name: Update NBM Plumes

on:
  schedule:
    - cron: "40 4,10,16,22 * * *" # ~3.5 h after the NBM long cycles (01, 07, 13, 19Z)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nbm-plumes:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with ecCodes (Herbie reads NBM GRIB2)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          miniforge-version: latest
          activate-environment: nbm

      - name: Install dependencies
        run: mamba install -y -n nbm herbie-data cfgrib eccodes xarray pandas numpy pyyaml

      - name: Build NBM plume data
        run: python scripts/nbm_plume.py

      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add assets/data/nbm_plumes.json
          git commit -m "Update NBM plumes [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
