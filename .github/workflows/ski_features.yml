name: Update Ski Tool Forecast

# Feeds the ski tool (assets/ski-model.js), runs the same Herbie setup as model_data.yml:
#   ski_nbm.py      -> data/ski/nbm_extract.json         NBM at every zone's forecast point, next three ski days
#   ski_features.py -> assets/data/ski_features.json     merged with snow depths (live_conditions.json), road risk and drive times
# Each run also saves the extract under data/ski/archive/ (one file per NBM cycle) so the tool can be scored against what happened.
# Avalanche danger is not connected yet (NWAC forecasts start in late November), so features carry avy_danger = -1.

on:
  schedule:
    - cron: "50 5,11,17,23 * * *" # ~5 h after the NBM long cycles (01, 07, 13, 19Z), a few minutes after model_data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ski-features
  cancel-in-progress: false

jobs:
  update-ski-features:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with ecCodes (Herbie reads GRIB2)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          miniforge-version: latest
          activate-environment: models

      - name: Install dependencies
        run: mamba install -y -n models herbie-data cfgrib eccodes xarray pandas numpy pyyaml

      - name: Extract the NBM at every zone
        run: python scripts/ski_nbm.py

      - name: Build the ski tool features
        run: python scripts/ski_features.py --real

      - name: Archive this cycle's extract for evaluation
        run: |
          mkdir -p data/ski/archive
          cycle=$(python -c "import json;print(json.load(open('data/ski/nbm_extract.json'))['cycle_utc'].replace(':','').replace('-',''))")
          cp data/ski/nbm_extract.json "data/ski/archive/${cycle}.json"

      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add assets/data/ski_features.json data/ski/nbm_extract.json data/ski/archive
          git commit -m "Update ski tool forecast [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
