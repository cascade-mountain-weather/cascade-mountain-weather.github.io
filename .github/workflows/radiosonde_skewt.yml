name: Render Radiosonde Skew-Ts

on:
  schedule:
    # Soundings launch at 00Z and 12Z and reach IEM within a few hours; later attempts catch late arrivals (an
    # already-rendered cycle is skipped, so extra runs are cheap). Port Hardy lags days and is picked up whenever it lands.
    - cron: "40 1,3,5,13,15,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radiosonde-skewt
  cancel-in-progress: false

jobs:
  render-skewt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-skewt.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-skewt.txt

      - name: Render skew-T composites
        run: python scripts/radiosonde_skewt.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add -A assets/data/radiosonde
          git commit -m "Update radiosonde skew-Ts [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
