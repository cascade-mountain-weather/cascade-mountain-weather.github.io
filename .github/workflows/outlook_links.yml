name: Update Outlook Chart Links

on:
  schedule:
    # ECMWF extended range (00Z runs) and SEAS5 (released about the 5th of each month) both land by mid-afternoon UTC.
    # A run with nothing new makes about 14 requests and commits nothing; the first run after a new forecast resolves the charts.
    - cron: "20 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook-links
  cancel-in-progress: false

jobs:
  update-outlook-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve the ECMWF outlook charts
        run: python scripts/outlook_links.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add assets/data/outlook_links.json
          git commit -m "Update outlook chart links [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
