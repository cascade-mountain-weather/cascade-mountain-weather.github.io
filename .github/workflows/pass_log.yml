name: Log Pass Closures

on:
  schedule:
    # Best effort: GitHub has run "hourly" schedules every 6 to 8 hours, so event times are only as precise as the polls that happen.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pass-log
  cancel-in-progress: false

jobs:
  log-passes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Log the current pass closures
        run: python scripts/pass_log.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add data/passes/log assets/data/pass_now.json
          git commit -m "Update pass log [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
