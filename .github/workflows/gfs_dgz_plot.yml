name: Update GFS Plot

on:
  schedule:
    - cron: "30 19 * * *" # once a day, ~7.5 h after the 12Z GFS run starts (UCAR THREDDS "latest" was still on the 06Z run at 17:20Z on Oct 9); the plot is the 48-hour forecast from that run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-plot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install matplotlib cartopy siphon xarray numpy netCDF4

      - name: Run plot script
        run: python scripts/gfs_dgz_plot.py

      - name: Commit and push updated plot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/gfs_dgz_F48.png
          git commit -m "Update GFS plot"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}