name: Update ECMWF Charts

# Twice a day, after the 00Z and 12Z ECMWF runs: ask ECMWF Open Charts (CC-BY-4.0) for the North Pacific jet, 500 hPa and 850 hPa
# charts of HRES, AIFS and the AIFS ensemble control, crop each to 100E-100W, and force-push the small WebP frames as ONE
# commit on the `ecmwf-charts` branch. Nothing is committed to main and the branch has no history, so the repository does not
# grow. The synoptic tools page reads them from raw.githubusercontent.com (site.ecmwf_charts_url in _config.yml).
# A run already published is skipped, so the extra schedule slots (ECMWF posts the AI runs later than HRES) are cheap.
on:
  schedule:
    - cron: "50 7,9,10 * * *"
    - cron: "50 19,21,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecmwf-charts
  cancel-in-progress: false

jobs:
  update-ecmwf-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Fetch the charts already published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch ecmwf-charts \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/site" \
            || mkdir -p "$RUNNER_TEMP/site"
          rm -rf "$RUNNER_TEMP/site/.git"

      - name: Fetch and crop the newest runs
        run: python scripts/fetch_ecmwf_charts.py --out "$RUNNER_TEMP/site" --workers 4

      - name: Publish as a single commit on ecmwf-charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init --quiet -b ecmwf-charts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "ECMWF charts $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" ecmwf-charts
