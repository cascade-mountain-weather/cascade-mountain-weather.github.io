name: Update Teleconnection State

on:
  schedule:
    # CPC updates the daily PNA and the GEFS PNA forecast once a day; PSL updates the ROMI MJO index about daily.
    - cron: "20 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tele-now
  cancel-in-progress: false

jobs:
  update-tele-now:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Collect the current PNA and MJO
        run: python scripts/tele_now.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add assets/data/tele_now.json
          git commit -m "Update teleconnection state [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
