name: Update North Pacific SST Anomaly Maps

on:
  schedule:
    - cron: "30 17 * * *" # daily; NCEI posts the previous day's OISST file by mid-morning Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sst-anomaly
  cancel-in-progress: false

jobs:
  render-sst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy xarray netCDF4 matplotlib

      - name: Render North Pacific SST anomaly maps
        run: python scripts/sst_anomaly_maps.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add -A assets/data/sst
          git commit -m "Update North Pacific SST anomaly maps [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
