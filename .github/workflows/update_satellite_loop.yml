name: Update Satellite Looper

# Every hour: build the newest GOES + radar frames (10 minutes apart), merge them into the last 6 hours of frames, and
# force-push the result as ONE commit on the `satellite-data` branch. Nothing is committed to main, and the
# branch never builds up history, so the repository does not grow with the frames. The satellite loop page
# reads them from raw.githubusercontent.com (site.satellite_data_url in _config.yml).
on:
  schedule:
    - cron: "5 * * * *" # hourly, offset from the live conditions run at :10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: satellite-loop
  cancel-in-progress: false

jobs:
  update-satellite-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Build COD GOES + radar frames
        run: |
          python scripts/build_cod_satellite_loop.py \
            --url "https://weather.cod.edu/satrad/?parms=subregional-Pac_NW-truecolor-48-1-100-2&checked=radar-ushw-usint-map&colorbar=undefined" \
            --output-dir "$RUNNER_TEMP/built" \
            --no-gif \
            --manifest-name satellite_manifest.json \
            --frames-subdir frames \
            --max-frames 40 \
            --delay-ms 300 \
            --max-width 1280 \
            --frame-format webp \
            --frame-quality 78 \
            --latest-frame-name latest_frame.webp

      - name: Fetch the frames already published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch satellite-data \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/site" \
            || mkdir -p "$RUNNER_TEMP/site"
          rm -rf "$RUNNER_TEMP/site/.git"

      - name: Merge the new frames and keep the last 6 hours
        run: python scripts/publish_satellite_frames.py --built "$RUNNER_TEMP/built" --site "$RUNNER_TEMP/site" --keep-hours 6 --min-gap-minutes 8

      - name: Publish as a single commit on satellite-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init --quiet -b satellite-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Satellite frames $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" satellite-data
