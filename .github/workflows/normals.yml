name: Update Season Normals

on:
  schedule:
    - cron: "30 13 * * *" # daily, ~5:30 am Pacific, after SNOTEL's overnight data load
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-normals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Compute percent-of-normal for each area
        run: python scripts/collect_normals.py

      - name: Commit and push updated normals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add assets/data/normals.json
          git commit -m "Update season normals [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
