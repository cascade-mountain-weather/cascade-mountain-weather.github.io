<header class="header-full">
    <a href="{{ '/index.html' | relative_url }}" class="header-home-link" aria-label="Cascade Mountain Weather home">
        <h1 class="header-brand"><span class="header-name"><span>Cascade</span> <span>Mountain</span> <span>Weather</span></span><img class="cmw-header-main-logo" src="{{ '/assets/images/cmw_logo-256.png' | relative_url }}" alt="" width="115" height="115" decoding="async"></h1>
    </a>
    <p class="tagline{% unless page.layout == 'home' %} tagline-hide-mobile{% endunless %}">{% if site.tagline_lines %}{% for line in site.tagline_lines %}<span>{{ line }}</span> {% endfor %}{% else %}{{ site.tagline }}{% endif %}</p>
    {% if page.coffee_button %}
    <a href="https://buymeacoffee.com/cascademtnwx" target="_blank" rel="noopener noreferrer" class="buy-coffee-btn" aria-label="Support us on Buy Me a Coffee">
        <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me A Coffee" />
    </a>
    {% endif %}
    <div class="header-social">
        <a href="https://x.com/CascadeMtnWX" target="_blank" rel="noopener noreferrer" aria-label="Cascade Mountain Weather on X (Twitter)" title="X / Twitter">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a href="https://www.instagram.com/cascademtnweather/" target="_blank" rel="noopener noreferrer" aria-label="Cascade Mountain Weather on Instagram" title="Instagram">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
    </div>
</header>
