# Single source of truth for the live-conditions map, the area pages' headers,
# and scripts/collect_live_conditions.py (which writes assets/data/live_conditions.json).
#
# network: NWAC   -> fetched from Synoptic by station id (e.g. STB48). Reports snow
#                    depth but NOT SWE.
# resort (optional, SNOTEL only): nearest ski area, shown beside the station on the homepage season charts.
# network: SNOTEL -> fetched from NRCS AWDB by triplet (e.g. "791:WA:SNTL"). Reports
#                    both snow depth and SWE. (Icicle Creek 1338 is new and only exists
#                    in AWDB, so all SNOTEL goes through AWDB.)
#
# primary: true  -> the station whose temp/humidity/visibility drives the area's
#                   checklist. If omitted, the first station with fresh data is used.
# page: null     -> no dive-deeper page yet; the popup omits the link.
# basin:         -> USGS HUC8 watershed code the map highlights for this area. Areas can
#                   share a basin (the popup then shows one tab per area). Polygons live in
#                   assets/data/basins.geojson; rebuild with scripts/build_basins.py after
#                   changing a code.
#
# Stations are listed in the order they were requested; the map sorts rows by
# elevation, high to low, for display.

areas:
  - id: hurricane-ridge
    name: Hurricane Ridge
    basin: "17110020"
    page: null
    webcams:
      - {type: windy, id: "1523123339", label: "Hurricane Hill - Mount Olympus"}
    stations:
      - {id: HUR53, network: NWAC, label: Hurricane Ridge, primary: true}
      - {id: "974:WA:SNTL", network: SNOTEL, label: Waterhole, resort: Hurricane Ridge}

